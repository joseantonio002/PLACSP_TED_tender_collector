[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "TenderWatch"
version = "0.1.0"
description = "Public procurement data platform for PLACSP and Generalitat de Catalunya"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tenderwatch*"]

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
pythonpath = ["research/scripts"]
addopts = "-ra --strict-markers -m 'not live'"
markers = ["live: requires a live external service; opt in with -m live"]
